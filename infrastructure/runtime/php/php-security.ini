expose_php=Off
display_errors=Off
log_errors=On
html_errors=Off
memory_limit=128M
max_execution_time=10
max_input_time=10
max_input_vars=1000
post_max_size=8M
upload_max_filesize=8M
file_uploads=Off
allow_url_fopen=Off
allow_url_include=Off
enable_dl=Off
user_ini.filename=
open_basedir=/var/www/project:/tmp
session.save_path=/tmp
session.use_strict_mode=1
session.cookie_httponly=1
session.cookie_samesite=Lax
disable_functions=apache_setenv,dl,exec,link,mail,passthru,pcntl_exec,popen,proc_open,putenv,shell_exec,symlink,system

<VirtualHost *:80>
    ServerName sandbox.3eb.site
    DocumentRoot /var/www/app/public
    ProxyPass /realtime-api/ http://realtime:1234/ retry=0 timeout=15
    ProxyPassReverse /realtime-api/ http://realtime:1234/

    ProxyPass /realtime/ ws://realtime:1234/realtime/ retry=0 timeout=60
    ProxyPassReverse /realtime/ ws://realtime:1234/realtime/

    Alias /assets/identity/ /var/www/shared/identity/
    Alias /vendor/monaco/vs/ /opt/threeebs/monaco/vs/
    Alias /vendor/realtime/ /opt/threeebs/realtime/
    <Directory /var/www/shared/identity>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /opt/threeebs/monaco/vs>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /opt/threeebs/realtime>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /var/www/app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
